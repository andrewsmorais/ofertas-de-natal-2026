<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <rect width="800" height="540" rx="16" fill="#173C29"/>
  <rect x="16" y="16" width="768" height="508" rx="12" fill="none" stroke="#D4A548" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Postcard 1 (Back Left tilted) -->
  <g transform="translate(80, 90) rotate(-4)">
    <rect width="310" height="220" rx="10" fill="#FAF4E8" stroke="#D4A548" stroke-width="3"/>
    <!-- Left main illustration on card -->
    <rect x="16" y="16" width="120" height="188" rx="6" fill="#9E1E28"/>
    <circle cx="76" cy="85" r="28" fill="#F6D57A"/>
    <path d="M46,165 Q76,120 106,165 Z" fill="#FAF4E8"/>
    <!-- Right message lines + round illustration -->
    <circle cx="255" cy="52" r="26" fill="#1E4E36" stroke="#D4A548" stroke-width="2.5"/>
    <circle cx="255" cy="52" r="12" fill="#F6D57A"/>
    <line x1="152" y1="108" x2="285" y2="108" stroke="#B6A38A" stroke-width="2"/>
    <line x1="152" y1="134" x2="285" y2="134" stroke="#B6A38A" stroke-width="2"/>
    <line x1="152" y1="160" x2="285" y2="160" stroke="#B6A38A" stroke-width="2"/>
    <line x1="152" y1="186" x2="245" y2="186" stroke="#B6A38A" stroke-width="2"/>
  </g>

  <!-- Postcard 2 (Front Right) -->
  <g transform="translate(360, 115) rotate(2)">
    <rect width="355" height="245" rx="12" fill="#FFFDF9" stroke="#C8932C" stroke-width="3.5"/>
    <!-- Left Main Illustration -->
    <rect x="18" y="18" width="142" height="209" rx="8" fill="#1D4B34"/>
    <polygon points="89,45 48,155 130,155" fill="#2A6B4B"/>
    <circle cx="89" cy="45" r="10" fill="#F6D57A"/>
    <rect x="79" y="155" width="20" height="22" fill="#8C5832"/>
    <text x="89" y="205" text-anchor="middle" fill="#FAF4E8" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="bold">Feliz Navidad</text>

    <!-- Second Round Illustration integrated in the card -->
    <circle cx="295" cy="62" r="34" fill="#9E1E28" stroke="#D4A548" stroke-width="3"/>
    <circle cx="295" cy="56" r="12" fill="#FAF4E8"/>
    <path d="M277,80 Q295,66 313,80" fill="none" stroke="#F6D57A" stroke-width="3"/>

    <!-- Writing lines -->
    <text x="178" y="58" fill="#7A141C" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="bold">Para:</text>
    <line x1="178" y1="118" x2="330" y2="118" stroke="#BCA88E" stroke-width="2"/>
    <line x1="178" y1="146" x2="330" y2="146" stroke="#BCA88E" stroke-width="2"/>
    <line x1="178" y1="174" x2="330" y2="174" stroke="#BCA88E" stroke-width="2"/>
    <line x1="178" y1="202" x2="290" y2="202" stroke="#BCA88E" stroke-width="2"/>
  </g>

  <text x="400" y="410" text-anchor="middle" fill="#F5E6C8" font-family="Montserrat, Arial, sans-serif" font-size="17">
    Temas: Jesús adulto, Papá Noel, renos, pingüinos y otros animales
  </text>

  <rect x="115" y="438" width="570" height="50" rx="25" fill="#9E1E28"/>
  <text x="400" y="469" text-anchor="middle" fill="#FAF5EC" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="bold">
    5. 25 Tarjetas Postales de Navidad para Escribir
  </text>
</svg>
