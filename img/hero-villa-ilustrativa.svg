<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#133323"/>
      <stop offset="65%" stop-color="#1E4B35"/>
      <stop offset="100%" stop-color="#285D43"/>
    </linearGradient>
    <linearGradient id="snowGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF6EE"/>
      <stop offset="100%" stop-color="#EBDDC8"/>
    </linearGradient>
    <linearGradient id="goldWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6D57A"/>
      <stop offset="100%" stop-color="#C8932C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="640" rx="18" fill="url(#bgSky)"/>
  <rect x="14" y="14" width="932" height="612" rx="12" fill="none" stroke="#D4A548" stroke-width="2" stroke-opacity="0.45"/>

  <!-- Subtle stars / snow dots in sky -->
  <g fill="#F8E7B8" opacity="0.65">
    <circle cx="110" cy="80" r="3"/>
    <circle cx="210" cy="55" r="2"/>
    <circle cx="340" cy="95" r="2.5"/>
    <circle cx="480" cy="50" r="3.5"/>
    <circle cx="620" cy="85" r="2.5"/>
    <circle cx="770" cy="60" r="3"/>
    <circle cx="850" cy="105" r="2"/>
    <circle cx="150" cy="175" r="2"/>
    <circle cx="810" cy="180" r="2.5"/>
    <circle cx="690" cy="145" r="2"/>
    <circle cx="275" cy="150" r="2"/>
  </g>

  <!-- Background paper pine trees -->
  <g fill="#112A1D" opacity="0.7">
    <polygon points="120,440 85,440 102.5,360"/>
    <polygon points="165,440 125,440 145,340"/>
    <polygon points="825,440 785,440 805,340"/>
    <polygon points="865,440 835,440 850,370"/>
  </g>

  <!-- Snow Hills (Paper Layers) -->
  <path d="M14,435 Q240,395 480,430 T946,425 L946,626 L14,626 Z" fill="#EFE4D2"/>
  <path d="M14,465 Q300,435 540,465 T946,455 L946,626 L14,626 Z" fill="url(#snowGround)"/>

  <!-- Paper Village House 1 (Left Red Cottage) -->
  <g transform="translate(170, 275)">
    <rect x="15" y="75" width="130" height="115" fill="#9E1E28" stroke="#FAF3E6" stroke-width="3"/>
    <polygon points="0,78 80,10 160,78" fill="#7A141C" stroke="#FAF3E6" stroke-width="4" stroke-linejoin="round"/>
    <!-- Windows -->
    <rect x="36" y="100" width="32" height="36" rx="4" fill="url(#goldWarm)" stroke="#FAF3E6" stroke-width="2.5"/>
    <line x1="52" y1="100" x2="52" y2="136" stroke="#7A141C" stroke-width="2"/>
    <line x1="36" y1="118" x2="68" y2="118" stroke="#7A141C" stroke-width="2"/>
    <rect x="92" y="100" width="32" height="36" rx="4" fill="url(#goldWarm)" stroke="#FAF3E6" stroke-width="2.5"/>
    <line x1="108" y1="100" x2="108" y2="136" stroke="#7A141C" stroke-width="2"/>
    <line x1="92" y1="118" x2="124" y2="118" stroke="#7A141C" stroke-width="2"/>
    <!-- Door -->
    <rect x="64" y="148" width="32" height="42" rx="16" fill="#183F2B" stroke="#FAF3E6" stroke-width="2.5"/>
    <circle cx="80" cy="164" r="6" fill="none" stroke="#E0B14B" stroke-width="3"/>
  </g>

  <!-- Paper Village Center Chapel / Clock Tower -->
  <g transform="translate(385, 165)">
    <!-- Spire -->
    <polygon points="65,65 95,0 125,65" fill="#8C1A23" stroke="#FAF3E6" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="73" y="65" width="44" height="55" fill="#F5E9D6" stroke="#C8932C" stroke-width="2.5"/>
    <circle cx="95" cy="92" r="13" fill="url(#goldWarm)" stroke="#7A141C" stroke-width="2.5"/>
    <!-- Main Hall -->
    <rect x="20" y="155" width="150" height="145" fill="#F8EFE0" stroke="#D1BA97" stroke-width="3"/>
    <polygon points="5,158 95,95 185,158" fill="#9E1E28" stroke="#FAF3E6" stroke-width="4" stroke-linejoin="round"/>
    <!-- Arch Windows -->
    <rect x="42" y="182" width="28" height="48" rx="14" fill="url(#goldWarm)" stroke="#7A141C" stroke-width="2.5"/>
    <rect x="120" y="182" width="28" height="48" rx="14" fill="url(#goldWarm)" stroke="#7A141C" stroke-width="2.5"/>
    <!-- Double Door -->
    <rect x="75" y="232" width="40" height="68" rx="20" fill="#8C1A23" stroke="#FAF3E6" stroke-width="3"/>
    <circle cx="95" cy="200" r="11" fill="#183F2B" stroke="#E0B14B" stroke-width="3"/>
  </g>

  <!-- Paper Village House 3 (Right Green & Gold Bakery) -->
  <g transform="translate(615, 265)">
    <rect x="15" y="75" width="140" height="125" fill="#1F4E37" stroke="#FAF3E6" stroke-width="3"/>
    <polygon points="0,78 85,12 170,78" fill="#9E1E28" stroke="#FAF3E6" stroke-width="4" stroke-linejoin="round"/>
    <!-- Garland -->
    <path d="M22,86 Q53,102 85,86 Q117,102 148,86" fill="none" stroke="#E0B14B" stroke-width="3.5"/>
    <!-- Shop Window -->
    <rect x="34" y="110" width="56" height="46" rx="5" fill="url(#goldWarm)" stroke="#FAF3E6" stroke-width="2.5"/>
    <line x1="62" y1="110" x2="62" y2="156" stroke="#1F4E37" stroke-width="2"/>
    <line x1="34" y1="133" x2="90" y2="133" stroke="#1F4E37" stroke-width="2"/>
    <!-- Door -->
    <rect x="106" y="128" width="32" height="72" rx="4" fill="#8C1A23" stroke="#FAF3E6" stroke-width="2.5"/>
    <rect x="113" y="136" width="18" height="22" fill="url(#goldWarm)"/>
  </g>

  <!-- Foreground Folded Paper Trees & Characters -->
  <g transform="translate(335, 395)">
    <polygon points="25,85 0,85 12.5,50" fill="#1F5138" stroke="#FAF3E6" stroke-width="2"/>
    <polygon points="23,60 2,60 12.5,30" fill="#266144" stroke="#FAF3E6" stroke-width="2"/>
  </g>
  <g transform="translate(580, 400)">
    <polygon points="30,85 0,85 15,42" fill="#1F5138" stroke="#FAF3E6" stroke-width="2"/>
    <polygon points="27,56 3,56 15,22" fill="#266144" stroke="#FAF3E6" stroke-width="2"/>
  </g>

  <!-- Dotted Cut Line Accent at Bottom to Evoke Papercraft -->
  <line x1="160" y1="525" x2="800" y2="525" stroke="#B69E7B" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Bottom Label Banner inside Image -->
  <rect x="190" y="542" width="580" height="54" rx="27" fill="#143323" stroke="#D4A548" stroke-width="2"/>
  <text x="480" y="575" text-anchor="middle" fill="#FAF5EC" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="bold">
    Villa Navideña de Papel — Vista Ilustrativa del Proyecto
  </text>
</svg>
